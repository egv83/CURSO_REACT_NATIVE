<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Curso AWS Practitioner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Bienvenido al curso de certificación AWS Practitioner</h1>

    <section class="card" aria-label="Galería de logos">
      <div class="logo-wrap">
        <img id="logo" src="img/aws-practitioner.png" alt="AWS Certified Cloud Practitioner" />
      </div>

      <div class="meta">
        <p id="counter" class="counter" aria-live="polite">1 / 3</p>
        <p id="label" class="label">AWS Certified Cloud Practitioner</p>
      </div>

      <div class="buttons">
        <button id="prevBtn" type="button">⬅ Anterior</button>
        <button id="nextBtn" type="button">Siguiente ➡</button>
      </div>

      <p class="hint">Tip: también puedes usar las teclas ← y →</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
